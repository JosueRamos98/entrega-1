server {
    listen 80;
    server_name _;

    # Capa estatica servida por el propio contenedor web
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Proxy inverso hacia el contenedor api.
    # "api" se resuelve por el DNS interno de la red red-entrega2:
    # no se usa ninguna IP, solo el nombre del servicio de Compose.
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
